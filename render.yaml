services:
  - type: postgresql
    name: banking-db
    databaseName: bank
    user: bankuser

  - type: web
    name: banking-app
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn --bind 0.0.0.0:$PORT app:app"
    healthCheckPath: "/health"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: banking-db
          property: connectionString
      - key: RECAPTCHA_SITE_KEY
        value: "your_recaptcha_site_key_here"
      - key: RECAPTCHA_SECRET_KEY
        value: "your_recaptcha_secret_key_here"
      - key: MAIL_SERVER
        value: "smtp.gmail.com"
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: "your_email@gmail.com"
      - key: MAIL_PASSWORD
        value: "your_app_password_here"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USE_SSL
        value: "false"
