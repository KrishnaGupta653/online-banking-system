<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style_loan_apply.css') }}"/>
    <link rel="icon" href="static\photos\icon1.ico" type="image/x-icon" />
    <title>Loan Application</title>
</head>
<body>
    <header>
        <h1>Apply For Loan</h1>
        <div class="top-links">
            <a href="javascript:history.back()" class="logout-link" ><h3>Back</h3></a>
            <a href="{{ url_for('logout') }}" class="logout-link"><h3>Logout</h3></a>
            </div>
      </header>
    <div class="main">
        
    <h2>Loan Application</h2>
    <form action="/apply_loan" method="POST">
        <label for="applicant_name">Applicant Name:</label>
        <input type="text" name="applicant_name" required><br>

        <label for="date_of_birth">Date of Birth:</label>
        <input type="date" name="date_of_birth" required><br>

        <label for="Verification_id_no">Verification Id:</label>
        <input type="text" name="Verification_id_no" required><br>

        <label for="contact_no">Contact No.:</label>
        <input type="text" name="contact_no" required><br>

        <label for="email_id">Email Id:</label>:</label>
        <input type="text" name="email_id" required><br>

        <label for="address">Address:</label>
        <input type="text" name="address" required><br>

        <label for="job_title">Job Title:</label>
        <select id="job_title" name="job_title">
            <option value="" selected disabled>Select Job Title</option>
            <option value="manager">Manager</option>
            <option value="designer">Designer</option>
            <option value="analyst">Analyst</option>
            <option value="engineer">Engineer</option>
            <option value="teacher">Teacher</option>
            <option value="doctor">Doctor</option>
            <option value="nurse">Nurse</option>
            <option value="accountant">Accountant</option>
            <option value="chef">Chef</option>
            <option value="salesperson">Salesperson</option>
            <option value="entrepreneur">Entrepreneur</option>
            <option value="student">Student</option>
            <option value="student">Bussinessman</option>
            <option value="lawyer">Lawyer</option>
            <option value="pharmacist">Pharmacist</option>
            <option value="social_worker">Social Worker</option>
        </select>
        <label for="loan_type">Loan Type:</label>
        <select name="loan_type" required>
            <option value="" selected disabled>Select Loan Type</option>
            <option value="Personal">Personal</option>
            <option value="Home">Home</option>
            <option value="Vehicle">Vehicle</option>
            <option value="Education">Education</option>
            <option value="Mortgage">Mortgage</option>
        </select><br>

        <label for="loan_amount">Loan Amount:</label>
        <input type="text" name="loan_amount"  required><br>

        <label for="loan_term">Loan Term (months):</label>
        <input type="text" name="loan_term" required><br>

        <label for="credit_score">Credit Score:</label>
        <input type="text" name="credit_score" required><br>

        <label for="application_date">Application Date:</label>
        <input type="date" id="application_date" name="application_date" required ><br>

        <button type="submit" value="Submit Application">Submit Application</button><br />

    </form>
    </div>
    <footer>
        <p>&copy; 2023 Banking System</p>
      </footer>
      <script>
        function setCurrentDate() {
          const today = new Date();
          const yyyy = today.getFullYear();
          const mm = String(today.getMonth() + 1).padStart(2, "0"); // January is 0!
          const dd = String(today.getDate()).padStart(2, "0");
          const currentDate = `${yyyy}-${mm}-${dd}`;
          document.getElementById("application_date").value = currentDate;
        }
        window.onload = setCurrentDate;
      </script>
      
</body>
</html>
