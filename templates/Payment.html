<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet" href="{{ url_for('static', filename='style_payment.css') }}"/>
    <link rel="icon" href="static\photos\icon1.ico" type="image/x-icon" />
    <title>Payment And Transfer</title>
  </head>
  <body>
    <header>
      <h1>Payment And Transfer</h1>
      <div class="top-links">
        <a href="javascript:history.back()" class="logout-link"><h3>Back</h3></a>
        <a href="{{ url_for('logout') }}" class="logout-link"><h3>Logout</h3></a>
      </div>
    </header>
    <main>
      <section class="payment-form">
        <h2>Make Payment</h2>
        <form action="/make_payment" method="POST">
          <label for="recipient_name">Recipient's Name:</label>
          <input type="text" name="recipient_name" id="recipient_name" required/>
          <label for="recipient_type">Recipient Type:</label>
          <select name="recipient_type" id="recipient_type" required>
            <option value="" selected disabled>Select Recipient Type</option>
            <option value="account">Account</option>
            <option value="phone">Phone Number</option>
          </select>
          <div id="account_recipient" class="recipient">
            <label for="recipient_account_number">Recipient's Account Number:</label>
            <input type="text" name="recipient_account_number" id="recipient_account_number" class="recipient-input"/>
          </div>
          <div id="phone_recipient" class="recipient">
            <label for="recipient_phone_number">Recipient's Phone Number:</label>
            <input type="text" name="recipient_phone_number" id="recipient_phone_number" class="recipient-input"/>
          </div>
          <label for="transaction_description">Transaction Description:</label>
          <input type="text" name="transaction_description" id="transaction_description"/>
        <label for="selected_account_id">Select Account:</label>
        <select name="selected_account_id" id="selected_account_id" required>
          <option value="" selected disabled>Select Account</option>
          {% for account in user_accounts %}
            <option value="{{ account['account_id'] }}">
              {{ account['bank_name']}} : {{account['account_number']}}-{{  account['account_type_name'] }}
            </option>
          {% endfor %}
        </select>

          <label for="transaction_date">Transaction Date:</label>
          <input type="date" id="transaction_date" name="transaction_date" />

          <label for="amount">Amount :</label>
          <input type="text" name="amount" id="amount" />

          <button type="submit">Pay</button>
          {% with messages = get_flashed_messages() %} {% if messages %}
          <div class="flashes-container">
            <ul class="flashes" style="color: #00ff00">
              {% for message in messages %}
              <li>{{ message }}</li>
              {% endfor %}
            </ul>
          </div>
          {% endif %} {% endwith %}
        </form>
      </section>
    </main>
    <footer>
      <p>&copy; 2023 Banking System</p>
    </footer>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const recipientTypeSelect = document.getElementById("recipient_type");
        const accountRecipientDiv =
          document.getElementById("account_recipient");
        const phoneRecipientDiv = document.getElementById("phone_recipient");

        // Function to toggle the visibility of recipient input fields
        function toggleRecipientFields() {
          if (recipientTypeSelect.value === "account") {
            accountRecipientDiv.style.display = "block";
            phoneRecipientDiv.style.display = "none";
          } else if (recipientTypeSelect.value === "phone") {
            accountRecipientDiv.style.display = "none";
            phoneRecipientDiv.style.display = "block";
          } else {
            // If "Select Recipient Type" is chosen, hide both input fields
            accountRecipientDiv.style.display = "none";
            phoneRecipientDiv.style.display = "none";
          }
        }

        // Add an event listener for changes to the recipient type select element
        recipientTypeSelect.addEventListener("change", toggleRecipientFields);

        // Call the function once to initialize the visibility based on the default value
        toggleRecipientFields();
      });
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        // Get the current date
        const currentDate = new Date();

        // Format the date as "YYYY-MM-DD" (the format required by the date input field)
        const year = currentDate.getFullYear();
        const month = (currentDate.getMonth() + 1).toString().padStart(2, "0"); // Add 1 to the month since it's zero-based
        const day = currentDate.getDate().toString().padStart(2, "0");

        // Construct the formatted date string
        const formattedDate = `${year}-${month}-${day}`;

        // Set the value of the date input field to the current date
        const dateInput = document.getElementById("transaction_date");
        dateInput.value = formattedDate;
      });
    </script>
  </body>
</html>
