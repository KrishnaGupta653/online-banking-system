<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style_forgot.css') }}">
    <link rel="icon" href="static/photos/icon1.ico" type="image/x-icon">
    <title>Forgot User ID and Password</title>
</head>
<body>
    <header>
        <h1>Forgot User ID / Password</h1>
        <div class="top-links">
            <a href="javascript:history.back()" class="logout-link"><h3>Back</h3></a>
            <a href="{{ url_for('logout') }}" class="logout-link"><h3>Logout</h3></a>
        </div>
    </header>
    <main>
        <section class="forgot-form">
            <h2>Retrieve User ID or Password</h2>
            <div class="center-content">
            <form id="retrieve-form" action="/forgotten" method="POST">
                <label for="option">Select what you want to retrieve:</label>
                <select name="option" id="option" required>
                    <option value="" selected disabled>Select What to Retrieve</option>
                    <option value="user_id">User ID</option>
                    <option value="password">Password</option>
                </select>
                <div id="user-id-form">
                    <label for="account_id_user">Account ID:</label>
                    <input type="text" id="account_id_user" name="account_id_user">
                    <label for="verification_id">Verification ID:</label>
                    <input type="text" id="verification_id" name="verification_id">
                </div>
                <div id="password-form" style="display: none;">
                    <label for="user_id_password">User ID:</label>
                    <input type="text" id="user_id_password" name="user_id_password">
                    <label for="account_id_password">Account ID:</label>
                    <input type="text" id="account_id_password" name="account_id_password">
                </div>
                <button type="submit" value="Submit Application">Retrieve</button>
            </form>
        </div>
            <div class="center-content">
            <section class="results">
                <div class="content-box">
                {% if user_id_result %}
                <p id="dis">Your User Id is :</p>
                <p id="user_id_result">{{ user_id_result }}</p>
                {% endif %}
                {% if password_result %}
                <p id="dis"> Your Password for login in is :</p>
                <p id="password_result">{{ password_result }}</p>
                {% endif %}
            </div>
            </section>
        </div>
        </section>

    </main>
    <footer>
        <p>&copy; 2023 Banking System</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const optionSelect = document.getElementById('option');
            const userIdForm = document.getElementById('user-id-form');
            const passwordForm = document.getElementById('password-form');
    
            optionSelect.addEventListener('change', () => {
                if (optionSelect.value === 'user_id') {
                    userIdForm.style.display = 'block';
                    passwordForm.style.display = 'none';
                } else if (optionSelect.value === 'password') {
                    userIdForm.style.display = 'none';
                    passwordForm.style.display = 'block';
                } else {
                    userIdForm.style.display = 'none';
                    passwordForm.style.display = 'none';
                }
            });
        });
    </script>
    
</body>
