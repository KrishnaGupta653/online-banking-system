<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style_income_tax.css') }}">
    <link rel="icon" href="static\photos\icon1.ico" type="image/x-icon" />
    <title>Income Tax Filing</title>
</head>
<body>
    <header>
        <h1>Income Tax Filing</h1>
        <div class="top-links">
            <a href="javascript:history.back()" class="logout-link"><h3>Back</h3></a>
            <a href="{{ url_for('logout') }}" class="logout-link"><h3>Logout</h3></a>
          </div>
    </header>
    <main>
        <section class="tax-form">
            <h2>Income Tax Filing Form</h2>
            <form action="/file_tax" method="POST">
                <label for="income">Total Income:</label>
                <input type="text" id="income" name="income" required>

                <label for="deductions">Deductions:</label>
                <input type="text" id="deductions" name="deductions">

                <!-- Additional form fields for tax filing -->
                <label for="dependents">Number of Dependents:</label>
                <input type="text" id="dependents" name="dependents">

                <label for="taxable_income">Taxable Income:</label>
                <input type="text" id="taxable_income" name="taxable_income">

                <label for="tax_rate">Tax Rate:</label>
                <input type="text" id="tax_rate" name="tax_rate">

                <label for="tax_amount">Tax Amount:</label>
                <input type="text" id="tax_amount" name="tax_amount">

                <label for="payment_method">Payment Method:</label>
                <select id="payment_method" name="payment_method">
                    <option value="credit_card">Credit Card</option>
                    <option value="bank_transfer">Bank Transfer</option>
                    <option value="check">Check</option>
                </select>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 Banking System</p>
    </footer>
</body>
</html>
