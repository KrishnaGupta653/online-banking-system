<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up for an Account</title>
    <style>
        .step-container {
            display: flex;
            justify-content: space-between;
            margin: 20px;
        }

        .step-box {
            width: 30%; /* Adjust the width as needed */
            border: 2px solid #ccc;
            padding: 20px;
            text-align: center;
            box-shadow: 0px 0px 5px 0px rgba(0,0,0,0.5);
        }

        .step-number {
            font-size: 24px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 20px;
        }

        p {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>How to Sign Up for an Account</h1>
    <div class="step-container">
        <div class="step-box">
            <div class="step-number">Step 1</div>
            <h2>Visit our website and click on the "Sign Up" button.</h2>
        </div>
        <div class="step-box">
            <div class="step-number">Step 2</div>
            <h2>Provide your personal information and create a username and password.</h2>
        </div>
        <div class="step-box">
            <div class="step-number">Step 3</div>
            <h2>Verify your identity and complete your account set-up.</h2>
        </div>
    </div>
</body>
</html>
